name: Test Windows scripts

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/test-windows-scripts.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # Windows PowerShell 5.1 and PowerShell 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: sync-project-skills.ps1
        run: |
          git config --bool core.symlinks
          scripts\sync-project-skills.ps1
          $expected = @(Get-ChildItem skills, external -Recurse -Filter SKILL.md | ForEach-Object { $_.Directory.Name } | Sort-Object -Unique).Count
          $actual = @(Get-ChildItem .claude\skills).Count
          if ($actual -ne $expected) { throw "expected $expected links, got $actual" }
          if (-not (Test-Path .claude\skills\tdd\SKILL.md)) { throw "link cannot reach SKILL.md" }
          $status = git status --porcelain
          if ($status) { $status; throw "git status not clean after sync" }

      - name: install.ps1
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'skills'
          scripts\install.ps1 $t
          if (-not (Test-Path (Join-Path $t 'tdd\SKILL.md'))) { throw "install failed" }
          if (-not (Test-Path (Join-Path $t 'my-example-skill\SKILL.md'))) { throw "install failed" }

      - name: remove-external.ps1 / add-external.ps1 -Tag
        run: |
          scripts\remove-external.ps1 mattpocock-skills
          if (Test-Path external\mattpocock-skills\skills) { throw "remove failed" }
          if (Test-Path .claude\skills\tdd) { throw "link not removed" }
          scripts\add-external.ps1 -Tag https://github.com/mattpocock/skills mattpocock-skills
          if ((git config -f .gitmodules submodule.external/mattpocock-skills.track) -ne 'tag') { throw "track not set to tag" }
          git -C external/mattpocock-skills describe --tags --exact-match
          if ($LASTEXITCODE -ne 0) { throw "not on a tag" }
          if (-not (Test-Path .claude\skills\tdd\SKILL.md)) { throw "link not recreated" }
          git diff --cached --name-status

      - name: update-external.ps1
        run: |
          scripts\update-external.ps1
          if ($LASTEXITCODE -ne 0) { throw "update failed" }
